# ===================================
# Quant-AI Docker Compose
# ===================================
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: "3.9"

services:
  # ===================================
  # API Service
  # ===================================
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql+psycopg://quant:quant@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===================================
  # Background Worker (RQ)
  # ===================================
  worker:
    build:
      context: .
      target: development
    command: python -m app.jobs.worker
    env_file:
      - .env
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql+psycopg://quant:quant@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===================================
  # PostgreSQL Database
  # ===================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quantdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================================
  # Redis (Job Queue)
  # ===================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================================
  # LocalStack (SQS + SNS for local dev)
  # ===================================
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - sqs

  # ===================================
  # SQS Worker (when using QUEUE_BACKEND=sqs)
  # ===================================
  sqs-worker:
    build:
      context: .
      target: development
    command: python -m app.workers.sqs_worker
    env_file:
      - .env
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql+psycopg://quant:quant@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_BACKEND=sqs
      - SQS_ENDPOINT_URL=http://localstack:4566
      - SNS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./app:/app/app:ro
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - sqs

  # ===================================
  # Kafka (KRaft mode, no Zookeeper)
  # ===================================
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Topic defaults
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - kafka

  # ===================================
  # Kafka Topic Init (one-shot)
  # ===================================
  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in market.prices news.raw news.scored signals.generated; do
          kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$topic \
            --partitions 3 --replication-factor 1
        done
        echo "Kafka topics created."
    profiles:
      - kafka

  # ===================================
  # Streaming Service (producers + consumers)
  # ===================================
  streaming:
    build:
      context: .
      target: development
    command: python -m app.streaming.service
    env_file:
      - .env
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql+psycopg://quant:quant@postgres:5432/quantdb
      - REDIS_URL=redis://redis:6379/0
      - BROKER_BACKEND=${BROKER_BACKEND:-redis}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - streaming

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  kafka_data:
