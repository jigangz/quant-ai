name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ scripts/ --ignore F401,F841,E501,F541,E402

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    env:
      PYTHONPATH: .
      ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./test_artifacts
      REDIS_URL: ""
      CACHE_BACKEND: "memory"
      BROKER_BACKEND: "memory"
      QUEUE_BACKEND: "memory"
      NOTIFY_BACKEND: "memory"
      FUNCTIONS_BACKEND: "local"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Create directories
        run: mkdir -p test_artifacts/registry

      - name: Syntax check all app/ files
        run: |
          find app/ -name '*.py' ! -path '*__pycache__*' -exec python -m py_compile {} +

      - name: Test imports
        run: |
          python -c "from app.main import app; print('Import OK')"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --ignore=tests/contract --ignore=tests/test_health.py --ignore=tests/test_cache.py -p no:cacheprovider -k "not TestStrategiesAPI"

      - name: Run cache tests (async, may have env-specific failures)
        run: pytest tests/test_cache.py -v --tb=short -p no:cacheprovider
        continue-on-error: true

      - name: Run integration smoke test (simulates Render deploy)
        run: |
          # Start uvicorn in background (same as Render CMD)
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 3
          
          # Health check
          HEALTH=$(python -c "
          import urllib.request, json, sys
          try:
              r = urllib.request.urlopen('http://localhost:8000/health', timeout=5)
              data = json.loads(r.read())
              print(data.get('status', 'unknown'))
          except Exception as e:
              print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          
          echo "Health check: $HEALTH"
          kill $SERVER_PID 2>/dev/null || true
          
          if [ "$HEALTH" != "ok" ]; then
            echo "::error::Health check failed: $HEALTH"
            exit 1
          fi

      - name: Run contract tests (DB required)
        if: false  # Enable when DB migrations are set up in CI
        run: pytest tests/contract/ -v --tb=short

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quant-ai:test --target production .
