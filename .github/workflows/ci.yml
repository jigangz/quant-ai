name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ scripts/ --ignore F401,F841,E501,F541,E402

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    env:
      PYTHONPATH: .
      ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./test_artifacts
      REDIS_URL: ""
      CACHE_BACKEND: "memory"
      BROKER_BACKEND: "memory"
      QUEUE_BACKEND: "memory"
      NOTIFY_BACKEND: "memory"
      FUNCTIONS_BACKEND: "memory"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Create directories
        run: mkdir -p test_artifacts/registry

      - name: Syntax check all app/ files
        run: |
          find app/ -name '*.py' ! -path '*__pycache__*' -exec python -m py_compile {} +

      - name: Test imports
        run: |
          python -c "from app.main import app; print('Import OK')"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --ignore=tests/contract -p no:cacheprovider

      - name: Run contract tests (DB required)
        if: false  # Enable when DB migrations are set up in CI
        run: pytest tests/contract/ -v --tb=short

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quant-ai:test --target production .
