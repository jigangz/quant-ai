name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ scripts/ --ignore F401,F841,E501,F541,E402

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    env:
      PYTHONPATH: .
      ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./test_artifacts
      REDIS_URL: ""
      CACHE_BACKEND: "memory"
      BROKER_BACKEND: "memory"
      QUEUE_BACKEND: "memory"
      NOTIFY_BACKEND: "memory"
      FUNCTIONS_BACKEND: "local"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Create directories
        run: mkdir -p test_artifacts/registry

      - name: Syntax check all app/ files
        run: |
          find app/ -name '*.py' ! -path '*__pycache__*' -exec python -m py_compile {} +

      - name: Test imports
        run: |
          python -c "from app.main import app; print('Import OK')"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --ignore=tests/contract -p no:cacheprovider

      - name: Run integration smoke test (simulates Render deploy)
        run: |
          # Start uvicorn in background (same as Render CMD)
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 3
          
          # Health check
          HEALTH=$(python -c "
          import urllib.request, json, sys
          try:
              r = urllib.request.urlopen('http://localhost:8000/health', timeout=5)
              data = json.loads(r.read())
              print(data.get('status', 'unknown'))
          except Exception as e:
              print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          
          echo "Health check: $HEALTH"
          kill $SERVER_PID 2>/dev/null || true
          
          if [ "$HEALTH" != "ok" ]; then
            echo "::error::Health check failed: $HEALTH"
            exit 1
          fi

      - name: Run contract tests
        run: pytest tests/contract/ -v --tb=short

  supabase-check:
    name: Supabase Connection Check
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true  # External service — don't block CI if unreachable
    # Only run on main branch pushes (not PRs, to avoid exposing secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Check Supabase connectivity
        run: |
          python -c "
          import httpx, os, sys
          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_KEY', '')
          if not url or not key:
              print('⚠️  Supabase secrets not configured, skipping')
              sys.exit(0)
          try:
              r = httpx.get(f'{url}/rest/v1/', headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}'
              }, timeout=10)
              print(f'✅ Supabase reachable: HTTP {r.status_code}')
              # 2xx/3xx/4xx all mean server is up (403 = auth issue, not downtime)
              if r.status_code >= 500:
                  print('::error::Supabase returned server error')
                  sys.exit(1)
          except Exception as e:
              print(f'::error::Supabase unreachable: {e}')
              sys.exit(1)
          "

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant-ai-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: quant-ai-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quant-ai:test --target production .

  deploy-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: [test, build]
    # Only after push to main (when Render actually deploys)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Render deploy
        run: sleep 120  # Render free tier takes ~2min to deploy

      - name: Health check on production
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf https://quant-ai-qzrg.onrender.com/health 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "fail")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "✅ Production is healthy!"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Production health check failed after 5 attempts (Render free tier may be sleeping)"
          # Don't fail the job — free tier spins down after inactivity
          exit 0
