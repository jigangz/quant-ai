apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-ai-api
  namespace: quant-ai
  labels:
    app: quant-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quant-ai-api
  template:
    metadata:
      labels:
        app: quant-ai-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: quant-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: quant-ai-config
            - secretRef:
                name: quant-ai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
